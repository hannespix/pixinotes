# Automatisches Deployment auf GitHub Pages — bei jedem Push auf den Branch.
# Baut die normale Web-Version (dist/) und legt zusätzlich die portable
# Single-File-Version als /pixinotes.html zum Download daneben.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [claude/notes-whiteboard-design-bnwvxj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # M317: Konto-Sync — die OAuth-Client-IDs kommen aus den Repository-
      # Variablen (Settings → Secrets and variables → Actions → Variables).
      # Fehlen sie, fragt die App in den Einstellungen danach.
      # M328: Eigenes Konto — VITE_SUPABASE_URL und VITE_SUPABASE_ANON_KEY
      # (der Anon-Key ist öffentlich; die Daten schützt Row Level Security).
      - name: Portable Single-File bauen (Download-Variante)
        run: npm run build:single
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_MS_TENANT: ${{ vars.VITE_MS_TENANT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Web-Version bauen
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_MS_TENANT: ${{ vars.VITE_MS_TENANT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Single-File zum Download in die Site legen
        run: cp release/pixinotes.html dist/pixinotes.html

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
