# Automatisches Deployment auf GitHub Pages — bei jedem Push auf den Branch.
# Baut die normale Web-Version (dist/) und legt zusätzlich die portable
# Single-File-Version als /pixinotes.html zum Download daneben.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [claude/notes-whiteboard-design-bnwvxj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Zwei Jobs, wie von GitHub für Pages vorgesehen: „bauen" lädt das Paket hoch, „deploy" veröffentlicht es danach.
# In einem einzigen Job fragte die Veröffentlichung das Paket 0,3 Sekunden nach dem Hochladen ab — GitHub kannte
# es dann mitunter noch nicht („Found 0 artifact(s)"), und der Lauf scheiterte trotz erfolgreichem Bau.
jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # M317: Konto-Sync — die OAuth-Client-IDs kommen aus den Repository-
      # Variablen (Settings → Secrets and variables → Actions → Variables).
      # Fehlen sie, fragt die App in den Einstellungen danach.
      # M328: Eigenes Konto — VITE_SUPABASE_URL und VITE_SUPABASE_ANON_KEY.
      # Vorgabe: das Projekt „pixinotes" (Frankfurt) des Betreibers; eine
      # Repository-Variable gleichen Namens hätte Vorrang. Der Anon-Key ist
      # öffentlich; die Daten schützt Row Level Security.
      - name: Portable Single-File bauen (Download-Variante)
        run: npm run build:single
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_MS_TENANT: ${{ vars.VITE_MS_TENANT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dckzqvbrffmemdzamtqr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3pxdmJyZmZtZW1kemFtdHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODc2NDIsImV4cCI6MjEwOTU2MzY0Mn0.KWHKi9w2CSrszq3xtQlMOCnyFlwO26QTXwnLWwUKBHs' }}

      - name: Web-Version bauen
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ vars.VITE_MS_CLIENT_ID }}
          VITE_MS_TENANT: ${{ vars.VITE_MS_TENANT }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dckzqvbrffmemdzamtqr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3pxdmJyZmZtZW1kemFtdHFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODc2NDIsImV4cCI6MjEwOTU2MzY0Mn0.KWHKi9w2CSrszq3xtQlMOCnyFlwO26QTXwnLWwUKBHs' }}

      - name: Single-File zum Download in die Site legen
        run: cp release/pixinotes.html dist/pixinotes.html

      # M443: MCP-Server für KI-Programme von außen — eine Datei, zum Download neben der App
      - name: MCP-Server bauen und in die Site legen
        run: npm run build:mcp && cp release/pixinotes-mcp.mjs dist/pixinotes-mcp.mjs

      # M458: Browser-Erweiterung „An PixiNotes senden" (Ordner erweiterung/) als ZIP zum Download neben der App –
      # installiert wird sie im Entwicklermodus („Entpackt laden"), siehe Hilfe. Kein Store, kein Server.
      - name: Browser-Erweiterung packen und in die Site legen
        run: npm run build:erweiterung && cp release/pixinotes-erweiterung.zip dist/pixinotes-erweiterung.zip

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v4
