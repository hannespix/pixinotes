<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixiNotes — Prototyp</title>
<style>
  :root {
    --bg: #f2efe9;
    --dot: #d8d3c8;
    --ink: #2b2a27;
    --muted: #8a8578;
    --card-shadow: 0 2px 6px rgba(60,50,30,.12), 0 10px 24px rgba(60,50,30,.08);
    --card-shadow-lift: 0 6px 14px rgba(60,50,30,.18), 0 24px 48px rgba(60,50,30,.16);
    --accent: #4f7cff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; color: var(--ink); }

  /* ---------- Board ---------- */
  #board {
    position: absolute; inset: 0;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    cursor: default;
    overflow: hidden;
  }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* ---------- Karten ---------- */
  .card {
    position: absolute;
    width: 240px;
    border-radius: 10px;
    box-shadow: var(--card-shadow);
    padding: 14px 16px 16px;
    user-select: none;
    transition: box-shadow .18s ease;
    will-change: transform;
  }
  .card.dragging { box-shadow: var(--card-shadow-lift); cursor: grabbing; z-index: 999; }
  .card:hover { box-shadow: var(--card-shadow-lift); }
  .card h3 { font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .card p, .card li, .card td, .card th { font-size: 12.5px; line-height: 1.45; }
  .card .meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }

  .sticky-yellow { background: #fff3a3; }
  .sticky-pink   { background: #ffd6e0; }
  .sticky-mint   { background: #d2f5dd; }
  .sticky-sky    { background: #d9ecff; }
  .card.white    { background: #fffdf7; }

  .card[contenteditable-area] { cursor: grab; }

  /* Notiz-Inhalt editierbar */
  .note-body { outline: none; min-height: 40px; cursor: text; }

  /* Checkliste */
  .check { list-style: none; }
  .check li { display: flex; gap: 7px; align-items: baseline; padding: 2px 0; cursor: pointer; }
  .check li .box { width: 13px; height: 13px; border: 1.6px solid #b7a63c; border-radius: 4px; flex: none; position: relative; top: 2px; background: #fffef0; }
  .check li.done .box { background: #7bc47f; border-color: #5aa35f; }
  .check li.done .box::after { content: "✓"; color: #fff; font-size: 10px; position: absolute; left: 2px; top: -1.5px; }
  .check li.done span { text-decoration: line-through; opacity: .55; }

  /* E-Mail-Karte */
  .email-card { width: 300px; }
  .email-card .from { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .email-card .avatar { width: 26px; height: 26px; border-radius: 50%; background: #6c8ef5; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 11px; background: #fff; border: 1px solid #e3ddcf; border-radius: 999px;
    padding: 3px 10px 3px 8px; display: inline-flex; gap: 5px; align-items: center;
    cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .12s ease;
  }
  .chip:hover { transform: translateY(-1px) scale(1.03); border-color: var(--accent); }
  .ai-hint {
    margin-top: 10px; font-size: 11px; background: rgba(124,92,255,.09); border: 1px dashed rgba(124,92,255,.45);
    color: #5b3fd4; border-radius: 8px; padding: 6px 9px; display: flex; gap: 6px; align-items: center;
  }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions button {
    font-size: 11px; border: none; background: rgba(0,0,0,.06); border-radius: 7px;
    padding: 4px 9px; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .actions button:hover { background: rgba(0,0,0,.12); }

  a.tel { color: #0a7d40; font-weight: 600; text-decoration: none; border-bottom: 1.5px dotted #0a7d40; }
  a.tel:hover { background: rgba(10,125,64,.1); border-radius: 3px; }

  /* Kanban */
  .kanban { width: 380px; }
  .kanban .cols { display: flex; gap: 8px; margin-top: 6px; }
  .kanban .col { flex: 1; background: rgba(0,0,0,.045); border-radius: 8px; padding: 7px; min-height: 90px; }
  .kanban .col h4 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 7px; }
  .kcard {
    background: #fff; border-radius: 6px; padding: 6px 8px; font-size: 11.5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 6px; cursor: grab; border-left: 3px solid #f5b53f;
  }
  .kcard.doing { border-left-color: #4f7cff; }
  .kcard.done-k { border-left-color: #55b96a; opacity: .7; }

  /* Tabelle */
  table { border-collapse: collapse; width: 100%; margin-top: 4px; }
  th, td { border-bottom: 1px solid rgba(0,0,0,.09); padding: 4px 6px; text-align: left; }
  th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .pill { font-size: 10px; padding: 1.5px 8px; border-radius: 999px; background: #ffe4b8; color: #8a5a00; }
  .pill.ok { background: #d2f0d8; color: #14682c; }

  /* Screenshot-Karte */
  .shot { width: 250px; padding: 10px; }
  .shot .img {
    border-radius: 6px; height: 120px;
    background: linear-gradient(135deg,#3d4a5d 0%,#2b3442 100%);
    position: relative; overflow: hidden; margin-bottom: 8px;
  }
  .shot .img::before { content: ""; position: absolute; left: 10px; top: 10px; right: 10px; height: 9px; border-radius: 3px; background: rgba(255,255,255,.25); }
  .shot .img::after  { content: ""; position: absolute; left: 10px; top: 27px; width: 60%; height: 50px; border-radius: 4px; background: rgba(255,255,255,.12); }

  /* Verbindungen */
  svg#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  svg#links path { stroke: rgba(90,80,60,.4); stroke-width: 2; fill: none; stroke-dasharray: 0; }
  svg#links path.suggest { stroke: rgba(124,92,255,.55); stroke-dasharray: 6 5; }
  svg#links text { font-size: 10px; fill: #7a7263; }

  /* Cluster-Insel */
  .island {
    position: absolute; border-radius: 24px; background: rgba(255,255,255,.4);
    border: 1.5px dashed rgba(140,130,110,.4); pointer-events: none;
  }
  .island label {
    position: absolute; top: -12px; left: 18px; background: #efe9dc; border-radius: 999px;
    font-size: 11px; font-weight: 700; padding: 3px 12px;
    color: #6d6550; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  /* Dock */
  #dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(50,40,20,.18);
    display: flex; gap: 4px; padding: 7px; z-index: 1000;
  }
  #dock button {
    border: none; background: none; font-size: 19px; width: 42px; height: 42px;
    border-radius: 11px; cursor: pointer; position: relative;
  }
  #dock button:hover { background: #f1ede4; }
  #dock button.active { background: #e8efff; }
  #dock button .tip {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: #2b2a27; color: #fff; font-size: 11px; padding: 4px 9px; border-radius: 6px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  #dock button:hover .tip { opacity: 1; }

  /* Kopfzeile */
  #topbar {
    position: fixed; top: 14px; left: 18px; z-index: 1000; display: flex; align-items: center; gap: 12px;
  }
  #topbar .logo { font-weight: 800; font-size: 17px; letter-spacing: -.02em; background: #fff; padding: 7px 14px; border-radius: 12px; box-shadow: 0 2px 10px rgba(50,40,20,.1); }
  #topbar .logo span { color: var(--accent); }
  #topbar .hint { font-size: 12px; color: var(--muted); background: rgba(255,255,255,.7); padding: 5px 11px; border-radius: 999px; }

  #avatars { position: fixed; top: 14px; right: 18px; display: flex; z-index: 1000; }
  #avatars .av { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; margin-left: -7px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.15); }

  /* Toast */
  #toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: #2b2a27; color: #fff; font-size: 12.5px; padding: 8px 16px; border-radius: 10px;
    opacity: 0; transition: all .25s ease; z-index: 1001; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .pin { position: absolute; top: -7px; left: 50%; transform: translateX(-50%); font-size: 15px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Pixi<span>Notes</span> <small style="font-weight:400;color:var(--muted)">· Prototyp</small></div>
  <div class="hint">Doppelklick = neue Notiz · Karten ziehen &amp; „werfen" · Checkboxen klicken ✓</div>
</div>

<div id="avatars">
  <div class="av" style="background:#f0762b">DU</div>
  <div class="av" style="background:#6c8ef5">SM</div>
  <div class="av" style="background:#55b96a">TK</div>
</div>

<div id="board">
  <div id="world">
    <svg id="links" width="4000" height="3000"></svg>

    <div class="island" id="island1" style="left:590px; top:60px; width:770px; height:560px;">
      <label>🏝️ Projekt Atlas · 5 Karten · 2 offene Aufgaben</label>
    </div>
  </div>
</div>

<div id="dock">
  <button class="active" title="Auswählen">🖱️<span class="tip">Auswählen (V)</span></button>
  <button id="btn-note">📝<span class="tip">Neue Notiz (N) — oder Doppelklick</span></button>
  <button>✏️<span class="tip">Stift / Skizze (P)</span></button>
  <button>🔗<span class="tip">Karten verbinden (L)</span></button>
  <button id="btn-tidy">✨<span class="tip">KI: Aufräumen &amp; Clustern</span></button>
  <button>🔍<span class="tip">Suche (Cmd+K)</span></button>
</div>

<div id="toast"></div>

<script>
"use strict";
const world = document.getElementById("world");
const linksSvg = document.getElementById("links");
const toastEl = document.getElementById("toast");

/* ---------- Karten-Daten ---------- */
let Z = 10;
const cards = [];   // {el, x, y, vx, vy, w, h}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

function addCard(el, x, y) {
  el.classList.add("card");
  el.style.left = "0px"; el.style.top = "0px";
  world.appendChild(el);
  const c = { el, x, y, vx: 0, vy: 0 };
  cards.push(c);
  el.__card = c;
  render(c);
  makeDraggable(c);
  return c;
}
function render(c) {
  c.el.style.transform = `translate(${c.x}px, ${c.y}px) rotate(${c.rot || 0}deg)`;
}

/* ---------- Drag mit Wurf-Physik ---------- */
function makeDraggable(c) {
  let sx, sy, ox, oy, lastX, lastY, lastT, moved;
  c.el.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".note-body, a, button, .chip, li, input")) return;
    e.preventDefault();
    c.el.setPointerCapture(e.pointerId);
    c.el.classList.add("dragging");
    c.el.style.zIndex = ++Z;
    sx = e.clientX; sy = e.clientY; ox = c.x; oy = c.y;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
    c.vx = c.vy = 0; moved = false;

    const move = (ev) => {
      const nx = ox + (ev.clientX - sx), ny = oy + (ev.clientY - sy);
      const now = performance.now(), dt = Math.max(1, now - lastT);
      c.vx = (ev.clientX - lastX) / dt * 16;
      c.vy = (ev.clientY - lastY) / dt * 16;
      lastX = ev.clientX; lastY = ev.clientY; lastT = now;
      c.x = nx; c.y = ny; moved = true;
      c.rot = Math.max(-4, Math.min(4, c.vx * 0.4));
      render(c); drawLinks();
    };
    const up = () => {
      c.el.classList.remove("dragging");
      c.el.removeEventListener("pointermove", move);
      c.el.removeEventListener("pointerup", up);
      c.rot = 0;
      if (!moved) { c.vx = c.vy = 0; }
    };
    c.el.addEventListener("pointermove", move);
    c.el.addEventListener("pointerup", up);
  });
}

/* ---------- Physik-Loop: Trägheit + sanfte Kollision + Snapping ---------- */
function physics() {
  for (const c of cards) {
    if (c.el.classList.contains("dragging")) continue;
    // Trägheit ("Wurf")
    if (Math.abs(c.vx) > 0.05 || Math.abs(c.vy) > 0.05) {
      c.x += c.vx; c.y += c.vy;
      c.vx *= 0.94; c.vy *= 0.94;
      c.rot = (c.rot || 0) * 0.9;
      render(c);
    } else if (c.rot) { c.rot *= 0.8; if (Math.abs(c.rot) < .05) c.rot = 0; render(c); }
  }
  // sanftes Auseinanderschieben bei Überlappung
  for (let i = 0; i < cards.length; i++) {
    for (let j = i + 1; j < cards.length; j++) {
      const a = cards[i], b = cards[j];
      if (a.el.classList.contains("dragging") || b.el.classList.contains("dragging")) continue;
      const aw = a.el.offsetWidth, ah = a.el.offsetHeight;
      const bw = b.el.offsetWidth, bh = b.el.offsetHeight;
      const dx = (a.x + aw/2) - (b.x + bw/2);
      const dy = (a.y + ah/2) - (b.y + bh/2);
      const px = (aw + bw)/2 - Math.abs(dx), py = (ah + bh)/2 - Math.abs(dy);
      if (px > 0 && py > 0) {
        const f = 0.06;
        if (px < py) { const s = Math.sign(dx) * px * f; a.x += s; b.x -= s; }
        else         { const s = Math.sign(dy) * py * f; a.y += s; b.y -= s; }
        render(a); render(b);
      }
    }
  }
  drawLinks();
  requestAnimationFrame(physics);
}

/* ---------- Verbindungen ---------- */
const links = [];  // {a, b, label, suggest}
function center(c) { return { x: c.x + c.el.offsetWidth/2, y: c.y + c.el.offsetHeight/2 }; }
function drawLinks() {
  let html = "";
  for (const l of links) {
    const p1 = center(l.a), p2 = center(l.b);
    const mx = (p1.x + p2.x)/2, my = (p1.y + p2.y)/2 - 26;
    html += `<path class="${l.suggest ? "suggest" : ""}" d="M ${p1.x} ${p1.y} Q ${mx} ${my} ${p2.x} ${p2.y}"/>`;
    if (l.label) html += `<text x="${mx}" y="${my + 10}" text-anchor="middle">${l.label}</text>`;
  }
  linksSvg.innerHTML = html;
}

/* ---------- Beispielkarten ---------- */
function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d; }

// Willkommens-Haftnotiz
const c1 = addCard(el(`
  <div class="pin">📌</div>
  <h3>👋 Willkommen!</h3>
  <div class="note-body" contenteditable="true" spellcheck="false">Das ist eine Haftnotiz — <b>klick rein und tipp los</b>.
  Zieh mich herum oder wirf mich mit Schwung übers Board! 🚀</div>
`), 120, 130);
c1.el.classList.add("sticky-yellow");

// E-Mail-Karte
const c2 = addCard(el(`
  <h3>📧 Angebot Q3 — bitte Freigabe</h3>
  <div class="from"><div class="avatar">SM</div><div><b style="font-size:12px">Sandra Meier</b><div class="meta" style="margin:0">Do 10:32 · Outlook</div></div></div>
  <p>Hi, anbei das finale Angebot. Kannst du bis <b>Freitag</b> freigeben? Bei Fragen ruf mich an: <a class="tel" href="tel:+491701234567" title="Anrufen">+49 170 1234567</a> ☎️</p>
  <div class="chips">
    <span class="chip" title="Anhang — rausziehen macht eine eigene Karte">📎 Angebot_Q3.pdf</span>
    <span class="chip">📎 Kalkulation.xlsx</span>
  </div>
  <div class="ai-hint">✨ KI erkannt: Aufgabe „Freigabe bis Fr 18.07." — als Karte anlegen?</div>
  <div class="actions"><button>↩ Antworten</button><button>📅 Termin</button><button>➕ Aufgabe</button></div>
`), 640, 120);
c2.el.classList.add("white", "email-card");

// Aufgaben-Checkliste
const c3 = addCard(el(`
  <h3>✅ Diese Woche</h3>
  <ul class="check">
    <li class="done"><span class="box"></span><span>Kickoff vorbereiten</span></li>
    <li><span class="box"></span><span>Angebot Q3 freigeben <small style="color:#c25e00">· Fr fällig</small></span></li>
    <li><span class="box"></span><span>Sandra zurückrufen</span></li>
  </ul>
`), 1010, 140);
c3.el.classList.add("sticky-mint");

// Kanban
const c4 = addCard(el(`
  <h3>📋 Projekt Atlas — Board</h3>
  <div class="cols">
    <div class="col"><h4>To Do</h4><div class="kcard">Landingpage-Texte</div><div class="kcard">Budget prüfen</div></div>
    <div class="col"><h4>Doing</h4><div class="kcard doing">Angebot Q3 ⚡</div></div>
    <div class="col"><h4>Done</h4><div class="kcard done-k">Kickoff ✓</div></div>
  </div>
  <div class="meta" style="margin-top:8px">Tickets lassen sich aufs Board herausziehen ↗</div>
`), 640, 420);
c4.el.classList.add("white", "kanban");

// Tabelle
const c5 = addCard(el(`
  <h3>📊 Lieferanten</h3>
  <table>
    <tr><th>Firma</th><th>Preis</th><th>Status</th></tr>
    <tr><td>Nordlicht GmbH</td><td>12.400 €</td><td><span class="pill ok">bestätigt</span></td></tr>
    <tr><td>Baltex AG</td><td>13.900 €</td><td><span class="pill">offen</span></td></tr>
  </table>
  <div class="meta" style="margin-top:7px">↻ Auch als Kanban oder Karten anzeigbar</div>
`), 1080, 430);
c5.el.classList.add("white");
c5.el.style.width = "260px";

// Screenshot
const c6 = addCard(el(`
  <div class="img"></div>
  <div class="meta">🖼️ screenshot_dashboard.png · <span style="color:#5b3fd4">✨ OCR: durchsuchbar</span></div>
`), 180, 460);
c6.el.classList.add("white", "shot");

// Idee (pink)
const c7 = addCard(el(`
  <h3>💡 Idee</h3>
  <div class="note-body" contenteditable="true" spellcheck="false">Statusbericht automatisch aus dem Cluster generieren lassen?</div>
`), 340, 690);
c7.el.classList.add("sticky-pink");
c7.rot = -2; render(c7);

/* Verbindungen */
links.push({ a: c2, b: c3, label: "Aufgabe daraus" });
links.push({ a: c2, b: c4, label: "gehört zu" });
links.push({ a: c7, b: c4, suggest: true, label: "✨ Vorschlag" });
drawLinks();

/* ---------- Interaktionen ---------- */
// Checklisten togglen (+ Konfetti-Moment)
document.addEventListener("click", (e) => {
  const li = e.target.closest(".check li");
  if (li) {
    li.classList.toggle("done");
    const ul = li.parentElement;
    if (![...ul.children].some(x => !x.classList.contains("done"))) {
      toast("🎉 Alles erledigt — stark!");
    }
  }
  const chip = e.target.closest(".chip");
  if (chip) toast("📎 Im echten Tool: Anhang öffnet Vorschau — oder per Drag als eigene Karte herauslösen.");
  const btn = e.target.closest(".actions button");
  if (btn) toast(`„${btn.textContent.trim()}" — im echten Tool direkt mit Outlook verknüpft.`);
});

// Doppelklick = neue Notiz
document.getElementById("board").addEventListener("dblclick", (e) => {
  if (e.target.closest(".card")) return;
  const colors = ["sticky-yellow", "sticky-pink", "sticky-mint", "sticky-sky"];
  const n = addCard(el(`
    <h3>📝 Neue Notiz</h3>
    <div class="note-body" contenteditable="true" spellcheck="false"></div>
  `), e.clientX - 120, e.clientY - 40);
  n.el.classList.add(colors[Math.floor(Math.random() * colors.length)]);
  n.el.style.zIndex = ++Z;
  n.el.querySelector(".note-body").focus();
  toast("Notiz erstellt — einfach lostippen ✍️");
});
document.getElementById("btn-note").addEventListener("click", () => {
  toast("Tipp: Doppelklick irgendwo auf dem Board erstellt eine Notiz.");
});

// „KI aufräumen" — Demo: Karten animiert ins Raster clustern
document.getElementById("btn-tidy").addEventListener("click", () => {
  toast("✨ KI ordnet thematisch… (Demo) — im echten Tool mit Vorher/Nachher-Vorschau & Undo");
  const targets = [
    [640, 120], [1010, 140], [640, 430], [1080, 430],  // Atlas-Cluster
    [120, 130], [180, 460], [180, 700]
  ];
  const order = [c2, c3, c4, c5, c1, c6, c7];
  order.forEach((c, i) => {
    const [tx, ty] = targets[i];
    animateTo(c, tx, ty);
  });
});
function animateTo(c, tx, ty) {
  const steps = 30; let s = 0;
  const sx = c.x, sy = c.y;
  const tick = () => {
    s++;
    const t = 1 - Math.pow(1 - s / steps, 3);
    c.x = sx + (tx - sx) * t; c.y = sy + (ty - sy) * t;
    render(c); drawLinks();
    if (s < steps) requestAnimationFrame(tick);
  };
  tick();
}

physics();
</script>
</body>
</html>
